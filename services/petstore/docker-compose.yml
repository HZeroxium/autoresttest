services:
  petstore:
    image: swaggerapi/petstore3:unstable
    container_name: swagger-petstore3
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/v3/openapi.json > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
